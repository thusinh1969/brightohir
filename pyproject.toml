[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brightohir"
version = "2.2.0"
description = "BrighTO HL7 Interoperability Runtime — FHIR R5, R4↔R5, V2.x↔R5 Python SDK"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "BrighTO Technology / Hatto AI"},
]
keywords = [
    "hl7", "fhir", "fhir-r5", "healthcare", "interoperability",
    "hl7v2", "pharmacy", "ehr", "clinical", "medical",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "fhir.resources>=8.0.0",
    "fhir-core>=1.1.0",
    "hl7apy>=1.3.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
client = ["fhirpy>=2.2.0"]
fhirpath = ["fhirpathpy>=0.2.0"]
dev = ["pytest>=8.0", "pytest-cov", "ruff", "build", "twine"]
all = ["fhirpy>=2.2.0", "fhirpathpy>=0.2.0"]

[project.urls]
Homepage = "https://github.com/thusinh1969/brightohir"
Documentation = "https://github.com/thusinh1969/brightohir#readme"
Repository = "https://github.com/thusinh1969/brightohir"
Issues = "https://github.com/thusinh1969/brightohir/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
brightohir = ["py.typed", "mappings/*.yaml", "data/**/*.jsonl", "data/**/*.md", "data/**/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# Deliberate patterns in this codebase:
# - BLE001: broad except for graceful degradation / optional dependencies
# - G201: logger.error(..., exc_info=True) with a static message
# - RUF012: class-level caches/fixtures (not instance defaults)
# - PERF102 / C401: non-semantic iteration micro-optimizations
# - TRY004: config loaders raise ValueError for malformed mapping (a value
#   problem, not an argument-type problem)
ignore = ["BLE001", "G201", "RUF012", "PERF102", "C401", "TRY004"]
